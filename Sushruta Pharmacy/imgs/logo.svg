<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradLeafLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6bb339"/>
      <stop offset="100%" stop-color="#4e8f26"/>
    </linearGradient>
    <linearGradient id="gradLeafDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#196336"/>
      <stop offset="100%" stop-color="#0f4523"/>
    </linearGradient>
  </defs>
  <!-- Outer circular swoop -->
  <path d="M 52,90 C 26,90 10,72 10,48 C 10,24 28,10 52,10 C 66,10 77,16 83,26" 
        fill="none" stroke="#0f4d2a" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Medical Plus -->
  <path d="M 28,32 L 36,32 M 32,28 L 32,36" 
        stroke="#4e8f26" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Bottom leaf bowl -->
  <path d="M 27,54 Q 38,78 68,78 C 52,78 30,70 27,54 Z" 
        fill="#0f4d2a"/>
  <!-- Dark leaf behind -->
  <path d="M 38,58 C 42,42 54,32 63,22 C 67,36 67,52 58,66 C 50,68 42,64 38,58 Z" 
        fill="url(#gradLeafDark)"/>
  <!-- Bright front leaf -->
  <path d="M 44,78 C 42,60 52,42 74,31 C 82,47 78,67 69,78 C 60,82 48,82 44,78 Z" 
        fill="url(#gradLeafLight)"/>
</svg>
